# =============================================================================
# Bathroom Wall Panel — ESPHome + LVGL
#
# Board:   Elecrow DLE06235B, ESP32-S3
# Display: ST77922 over QSPI, 320x480 native, run landscape as 480x320
# Touch:   ST77922's own touch block, I2C 0x55 (custom component, see
#          components/st77922_touch/)
#
# Pins, driver model and the vendor init sequence were taken from the working
# Arduino sketch and its esp_panel_board_custom_conf.h. The entity IDs marked
# CHECK are still placeholders — see README.md.
# =============================================================================

substitutions:
  device_name: bathroom-panel
  friendly_name: "Bathroom Panel"
  timezone: "America/Chicago"          # CST6CDT, matching the sketch

  # --- Home Assistant entities ------------------------------------------------
  # Confirmed present in the Arduino sketch:
  ent_pool_waterfall:     switch.waterfall
  ent_pool_bubblers:      switch.bubblers
  ent_fan:                switch.calebs_fan
  ent_fan_domain:         switch        # set to `fan` if you move to a fan entity
  ent_fan_title:          "Caleb's fan"

  # Still placeholders — replace with your real entity IDs:
  ent_indoor_temp:        sensor.calebs_room_temperature      # CHECK
  ent_indoor_trend:       sensor.calebs_room_temperature_trend
  ent_outdoor_temp:       sensor.ambient_outdoor_temperature  # CHECK
  ent_outdoor_trend:      sensor.ambient_outdoor_temperature_trend
  ent_outdoor_condition:  sensor.outdoor_condition
  ent_pool_air_temp:      sensor.ambient_outdoor_temperature  # CHECK
  ent_pool_water_temp:    sensor.pool_water_temperature       # CHECK
  ent_media_player:       media_player.spotify_caleb          # CHECK
  ent_daily_quote:        sensor.panel_daily_quote

  # --- Behaviour --------------------------------------------------------------
  page_timeout:      "30s"    # Pool/Fan auto-return to Home
  manual_hold_time:  "45s"    # how long a manual idle/media override sticks
  paused_grace_time: "3min"   # how long media mode survives a pause
  brush_seconds:     "120"    # tooth-brushing timer length

  # --- Hardware: display (QSPI) -----------------------------------------------
  pin_disp_sck:   GPIO12
  pin_disp_d0:    GPIO11
  pin_disp_d1:    GPIO13
  pin_disp_d2:    GPIO14
  pin_disp_d3:    GPIO9
  pin_disp_cs:    GPIO10

  # Shared LCD + touch reset, active low. Pulsed from on_boot, not from either
  # component — see the note on the on_boot block below.
  pin_panel_rst:  GPIO48

  # Backlight is a plain on/off enable on this board (the vendor BSP declares
  # it SWITCH_GPIO and the sketch drives it with digitalWrite), so it is a
  # binary light rather than a PWM one.
  pin_backlight:  GPIO41

  # --- Hardware: touch --------------------------------------------------------
  pin_touch_sda:  GPIO38
  pin_touch_scl:  GPIO39
  pin_touch_int:  GPIO47

  # --- Hardware: I2S speaker --------------------------------------------------
  # !! UNVERIFIED !! The Arduino sketch contains no audio code at all, so these
  # are guesses that avoid every pin the display and touch use. Wrong values
  # mean silence, not damage, but confirm them against the board before
  # trusting the brushing chimes. To drop audio entirely, delete the
  # i2s_audio / speaker / rtttl blocks and the three sound scripts.
  pin_i2s_bclk:   GPIO42
  pin_i2s_lrclk:  GPIO2
  pin_i2s_dout:   GPIO1

  # --- Hardware: memory -------------------------------------------------------
  flash_size:  16MB
  psram_mode:  octal           # CHECK: `quad` on most 8MB-PSRAM S3 modules

# =============================================================================
# ICON GLYPH TABLE  (Material Design Icons, verified against the webfont's
# _variables.scss — if one renders blank, look it up at
# https://pictogrammers.com/library/mdi/)
#
#   \U000F0599  weather-sunny        \U000F0590  weather-cloudy
#   \U000F0597  weather-rainy        \U000F0594  weather-night
#   \U000F050F  thermometer          \U000F02E3  bed
#   \U000F0210  fan                  \U000F078D  waves
#   \U000F058C  water                \U000F05E3  chart-bubble
#   \U000F075A  music                \U000F0141  chevron-left
#   \U000F040A  play                 \U000F03E4  pause
#   \U000F04AD  skip-next            \U000F04AE  skip-previous
#   \U000F057E  volume-high          \U000F1129  toothbrush
#   \U000F005C  arrow-top-right      \U000F0054  arrow-right
#   \U000F0043  arrow-bottom-right
# =============================================================================

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.2.0
  on_boot:
    # GPIO48 resets the touch block and the LCD together. The vendor BSP wants
    # it pulsed before the LCD is configured — doing it afterwards wipes the
    # panel init. gpio outputs are set up at priority 800 and the display at
    # 600, so 700 is the window where the pin exists but the panel has not been
    # initialised yet.
    - priority: 700
      then:
        - output.turn_off: panel_reset
        - delay: 120ms
        - output.turn_on: panel_reset
        - delay: 200ms
    - priority: 600
      then:
        - light.turn_on: backlight
        - script.execute: script_update_clock
        - script.execute: script_apply_mode

esp32:
  board: esp32-s3-devkitc-1
  flash_size: ${flash_size}
  framework:
    type: esp-idf

psram:
  mode: ${psram_mode}
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

# Clock is local SNTP so the panel keeps telling time with HA down.
time:
  - platform: sntp
    id: esptime
    timezone: ${timezone}
    on_time:
      - seconds: 0
        then:
          - script.execute: script_update_clock
    on_time_sync:
      - script.execute: script_update_clock

globals:
  - id: g_media_playing
    type: bool
    restore_value: no
    initial_value: "false"
  - id: g_manual_override
    type: bool
    restore_value: no
    initial_value: "false"
  - id: g_manual_media
    type: bool
    restore_value: no
    initial_value: "false"
  - id: g_brush_active
    type: bool
    restore_value: no
    initial_value: "false"
  - id: g_brush_remaining
    type: int
    restore_value: no
    initial_value: "0"
  - id: g_volume_pending
    type: float
    restore_value: no
    initial_value: "0.0"

# =============================================================================
# Hardware
# =============================================================================

external_components:
  - source:
      type: local
      path: components
    components: [st77922_touch]

spi:
  - id: bus_display
    type: quad
    clk_pin: ${pin_disp_sck}
    data_pins:
      - ${pin_disp_d0}
      - ${pin_disp_d1}
      - ${pin_disp_d2}
      - ${pin_disp_d3}

i2c:
  - id: bus_touch
    sda: ${pin_touch_sda}
    scl: ${pin_touch_scl}
    frequency: 100kHz
    scan: true

output:
  - platform: gpio
    id: backlight_output
    pin: ${pin_backlight}
  - platform: gpio
    id: panel_reset
    pin: ${pin_panel_rst}

light:
  - platform: binary
    id: backlight
    name: "Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    id: main_display
    model: CUSTOM
    spi_id: bus_display
    bus_mode: quad
    cs_pin: ${pin_disp_cs}
    data_rate: 80MHz
    # Logical (post-transform) size. With explicit dimensions ESPHome uses
    # these as given and does not swap them for swap_xy, so a 320x480 panel
    # run landscape is declared 480x320 here.
    dimensions:
      width: 480
      height: 320
    # Landscape. If the image is upside down, flip these — and make the
    # identical change under touchscreen: transform:.
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    color_order: rgb
    invert_colors: true         # the vendor sequence ends in INVON (0x21)
    # Both required when LVGL drives the display.
    auto_clear_enabled: false
    update_interval: never
    # Ported from ESP_PANEL_BOARD_LCD_VENDOR_INIT_CMD() in the Arduino board
    # config. Commands ESPHome issues itself were stripped: COLMOD (0x3A),
    # MADCTL (0x36), INVON (0x21), SLPOUT (0x11), DISPON (0x29), and the
    # per-draw window/write commands CASET/RASET/RAMWR (0x2A/0x2B/0x2C).
    init_sequence:
      - [0xF1, 0x00]
      - [0x60, 0x00, 0x00, 0x00]
      - [0x65, 0x80]
      - [0x79, 0x06]
      - [0x7B, 0x00, 0x08, 0x08]
      - [0x80, 0x55, 0x62, 0x2F, 0x17, 0xF0, 0x52, 0x70, 0xD2, 0x52, 0x62, 0xEA]
      - [0x81, 0x26, 0x52, 0x72, 0x27]
      - [0x84, 0x92, 0x25]
      - [0x87, 0x10, 0x10, 0x58, 0x00, 0x02, 0x3A]
      - [0x88, 0x00, 0x00, 0x2C, 0x10, 0x04, 0x00, 0x00, 0x00, 0x01, 0x01, 0x01, 0x01, 0x01, 0x00, 0x06]
      - [0x89, 0x00, 0x00, 0x00]
      - [0x8A, 0x13, 0x00, 0x2C, 0x00, 0x00, 0x2C, 0x10, 0x10, 0x00, 0x3E, 0x19]
      - [0x8B, 0x15, 0xB1, 0xB1, 0x44, 0x96, 0x2C, 0x10, 0x97, 0x8E]
      - [0x8C, 0x1D, 0xB1, 0xB1, 0x44, 0x96, 0x2C, 0x10, 0x50, 0x0F, 0x01, 0xC5, 0x12, 0x09]
      - [0x8D, 0x0C]
      - [0x8E, 0x33, 0x01, 0x0C, 0x13, 0x01, 0x01]
      - [0xB3, 0x00, 0x30]
      - [0xF1, 0x00]
      - [0x71, 0xC0]
      - [0x66, 0x02, 0x3F]
      - [0xBE, 0x24, 0x00, 0x9D]
      - [0x70, 0x01, 0xA0, 0x11, 0x40, 0xE0, 0x00, 0x11, 0x69, 0x11, 0x00, 0x00, 0x1A]
      - [0x90, 0x04, 0x04, 0x55, 0x74, 0x00, 0x40, 0x43, 0x27, 0x27]
      - [0x91, 0x04, 0x04, 0x55, 0x75, 0x00, 0x40, 0x42, 0x27, 0x27]
      - [0x92, 0x04, 0x44, 0x55, 0xC0, 0x06, 0x00, 0x07, 0x05, 0x90, 0x27]
      - [0x93, 0x04, 0x43, 0x11, 0x00, 0x00, 0x00, 0x00, 0x05, 0x90, 0x27]
      - [0x94, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0x95, 0x96, 0x16, 0x00, 0x00, 0xFF]
      - [0x96, 0x44, 0x53, 0x03, 0x12, 0x23, 0x24, 0x06, 0x05, 0x94, 0x27, 0x00, 0x44]
      - [0x97, 0x44, 0x53, 0x47, 0x56, 0x20, 0x20, 0x02, 0x01, 0x94, 0x27, 0x00, 0x44]
      - [0xBA, 0x55, 0x94, 0x2D, 0x94, 0x27]
