# Home Assistant state -> screen
# =============================================================================

sensor:
  - platform: homeassistant
    id: ha_indoor_temp
    entity_id: ${ent_indoor_temp}
    on_value:
      - lvgl.label.update:
          id: lbl_indoor_temp
          text: !lambda 'return str_sprintf("%.0f°", x);'

  - platform: homeassistant
    id: ha_outdoor_temp
    entity_id: ${ent_outdoor_temp}
    on_value:
      - lvgl.label.update:
          id: lbl_outdoor_temp
          text: !lambda 'return str_sprintf("%.0f°", x);'

  - platform: homeassistant
    id: ha_pool_air
    entity_id: ${ent_pool_air_temp}
    on_value:
      - lvgl.label.update:
          id: lbl_pool_air
          text: !lambda 'return str_sprintf("%.0f°", x);'

  - platform: homeassistant
    id: ha_pool_water
    entity_id: ${ent_pool_water_temp}
    on_value:
      - lvgl.label.update:
          id: lbl_pool_water
          text: !lambda 'return str_sprintf("%.0f°", x);'

  # lv_slider_set_value() does not emit VALUE_CHANGED, so this cannot loop
  # back out as a volume_set call.
  - platform: homeassistant
    id: ha_media_volume
    entity_id: ${ent_media_player}
    attribute: volume_level
    on_value:
      - lvgl.slider.update:
          id: sld_volume
          value: !lambda "return x * 100.0f;"

text_sensor:
  - platform: homeassistant
    id: ha_indoor_trend
    entity_id: ${ent_indoor_trend}
    on_value:
      - lambda: |-
          const char *icon = "\U000F0054";      // arrow-right / steady
          uint32_t col = 0x9A9A9A;
          if (x == "rising")       { icon = "\U000F005C"; col = 0xE8734A; }
          else if (x == "falling") { icon = "\U000F0043"; col = 0x6FA8DC; }
          lv_label_set_text(id(lbl_indoor_trend), icon);
          lv_obj_set_style_text_color(id(lbl_indoor_trend),
              lv_color_hex(col), LV_PART_MAIN);

  - platform: homeassistant
    id: ha_outdoor_trend
    entity_id: ${ent_outdoor_trend}
    on_value:
      - lambda: |-
          const char *icon = "\U000F0054";
          uint32_t col = 0x9A9A9A;
          if (x == "rising")       { icon = "\U000F005C"; col = 0xE8734A; }
          else if (x == "falling") { icon = "\U000F0043"; col = 0x6FA8DC; }
          lv_label_set_text(id(lbl_outdoor_trend), icon);
          lv_obj_set_style_text_color(id(lbl_outdoor_trend),
              lv_color_hex(col), LV_PART_MAIN);

  - platform: homeassistant
    id: ha_outdoor_condition
    entity_id: ${ent_outdoor_condition}
    on_value:
      - lambda: |-
          const char *icon = "\U000F0590";      // cloudy
          uint32_t col = 0x9A9A9A;
          if (x == "sunny")      { icon = "\U000F0599"; col = 0xF2B138; }
          else if (x == "rain")  { icon = "\U000F0597"; col = 0x62B6E8; }
          else if (x == "night") { icon = "\U000F0594"; col = 0xBFC7D5; }
          lv_label_set_text(id(lbl_outdoor_icon), icon);
          lv_obj_set_style_text_color(id(lbl_outdoor_icon),
              lv_color_hex(col), LV_PART_MAIN);

  - platform: homeassistant
    id: ha_quote
    entity_id: ${ent_daily_quote}
    on_value:
      - lvgl.label.update:
          id: lbl_quote
          text: !lambda "return x;"

  - platform: homeassistant
    id: ha_media_state
    entity_id: ${ent_media_player}
    on_value:
      - lambda: |-
          id(g_media_playing) = (x == "playing");
          lv_label_set_text(id(lbl_playpause_icon),
              x == "playing" ? "\U000F03E4" : "\U000F040A");
      - if:
          condition:
            lambda: 'return x == "paused";'
          then:
            - lambda: "id(g_media_playing) = true;"
            - script.execute: script_paused_grace
          else:
            - script.stop: script_paused_grace
      - script.execute: script_apply_mode

  - platform: homeassistant
    id: ha_media_title
    entity_id: ${ent_media_player}
    attribute: media_title
    on_value:
      - lvgl.label.update:
          id: lbl_track
          text: !lambda 'return x.empty() ? std::string("Nothing playing") : x;'

  - platform: homeassistant
    id: ha_media_artist
    entity_id: ${ent_media_player}
    attribute: media_artist
    on_value:
      - lvgl.label.update:
          id: lbl_artist
          text: !lambda "return x;"

binary_sensor:
  - platform: homeassistant
    id: ha_waterfall
    entity_id: ${ent_pool_waterfall}
    on_state:
      - lambda: |-
          bool on = x;
          lv_obj_set_style_bg_color(id(tile_waterfall),
              lv_color_hex(on ? 0x5DCAA5 : 0x1D1D1D), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_waterfall_icon),
              lv_color_hex(on ? 0x04342C : 0x6E6E6E), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_waterfall_name),
              lv_color_hex(on ? 0x04342C : 0xF2F2F2), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_waterfall_state),
              lv_color_hex(on ? 0x04342C : 0x9A9A9A), LV_PART_MAIN);
          lv_label_set_text(id(lbl_waterfall_state), on ? "On" : "Off");

  - platform: homeassistant
    id: ha_bubblers
    entity_id: ${ent_pool_bubblers}
    on_state:
      - lambda: |-
          bool on = x;
          lv_obj_set_style_bg_color(id(tile_bubblers),
              lv_color_hex(on ? 0x5DCAA5 : 0x1D1D1D), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_bubblers_icon),
              lv_color_hex(on ? 0x04342C : 0x6E6E6E), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_bubblers_name),
              lv_color_hex(on ? 0x04342C : 0xF2F2F2), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_bubblers_state),
              lv_color_hex(on ? 0x04342C : 0x9A9A9A), LV_PART_MAIN);
          lv_label_set_text(id(lbl_bubblers_state), on ? "On" : "Off");

  - platform: homeassistant
    id: ha_fan
    entity_id: ${ent_fan}
    on_state:
      - lambda: |-
          bool on = x;
          lv_obj_set_style_bg_color(id(btn_fan_toggle),
              lv_color_hex(on ? 0x5DCAA5 : 0x1D1D1D), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_fan_icon),
              lv_color_hex(on ? 0x04342C : 0x6E6E6E), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_fan_state),
              lv_color_hex(on ? 0x04342C : 0x9A9A9A), LV_PART_MAIN);
          lv_label_set_text(id(lbl_fan_state), on ? "On" : "Off");
          lv_label_set_text(id(lbl_fan_hint),
              on ? "Tap to turn off" : "Tap to turn on");

# =============================================================================
# Panel-local controls exposed back to Home Assistant
# =============================================================================

switch:
  - platform: template
    id: sw_mute
    name: "Panel sounds muted"
    icon: "mdi:volume-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: template
    name: "Start brushing timer"
    icon: "mdi:toothbrush"
    on_press:
      - script.execute: script_brush_toggle
  - platform: restart
    name: "Restart"
