# =============================================================================
# Scripts
# =============================================================================

script:
  # Clock, date and the weekday strip. Runs on the minute and on SNTP sync.
  - id: script_update_clock
    mode: restart
    then:
      - lambda: |-
          auto now = id(esptime).now();
          if (!now.is_valid()) return;

          int h = now.hour % 12;
          if (h == 0) h = 12;
          char t[8];
          snprintf(t, sizeof(t), "%d:%02d", h, now.minute);
          lv_label_set_text(id(lbl_clock), t);
          lv_label_set_text(id(lbl_pool_clock), t);
          lv_label_set_text(id(lbl_fan_clock), t);

          static const char *MON[] = {"Jan","Feb","Mar","Apr","May","Jun",
                                      "Jul","Aug","Sep","Oct","Nov","Dec"};
          char d[16];
          snprintf(d, sizeof(d), "%s %d", MON[now.month - 1], now.day_of_month);
          lv_label_set_text(id(lbl_date), d);

          lv_obj_t *chips[7] = {id(chip_0), id(chip_1), id(chip_2), id(chip_3),
                                id(chip_4), id(chip_5), id(chip_6)};
          lv_obj_t *marks[7] = {id(chip_lbl_0), id(chip_lbl_1), id(chip_lbl_2),
                                id(chip_lbl_3), id(chip_lbl_4), id(chip_lbl_5),
                                id(chip_lbl_6)};
          int wd = now.day_of_week - 1;   // ESPHome day_of_week: 1 = Sunday
          for (int i = 0; i < 7; i++) {
            bool today = (i == wd);
            lv_obj_set_style_bg_color(chips[i],
                lv_color_hex(today ? 0x5DCAA5 : 0x262626), LV_PART_MAIN);
            lv_obj_set_style_text_color(marks[i],
                lv_color_hex(today ? 0x04342C : 0x6E6E6E), LV_PART_MAIN);
          }

  # Decide whether the middle zone shows temps+quote or Spotify.
  - id: script_apply_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(g_manual_override) ? id(g_manual_media)
                                           : id(g_media_playing);
          then:
            - lvgl.widget.hide: cont_idle
            - lvgl.widget.show: cont_media
            - lvgl.label.update:
                id: lbl_override_icon
                text: "\U000F050F"        # thermometer -> back to idle
          else:
            - lvgl.widget.show: cont_idle
            - lvgl.widget.hide: cont_media
            - lvgl.label.update:
                id: lbl_override_icon
                text: "\U000F075A"        # music -> jump to media

  # A manual tap pins the chosen mode; auto logic resumes afterwards.
  - id: script_manual_hold
    mode: restart
    then:
      - delay: ${manual_hold_time}
      - lambda: "id(g_manual_override) = false;"
      - script.execute: script_apply_mode

  # Paused Spotify keeps media mode up for a while, then gives up.
  - id: script_paused_grace
    mode: restart
    then:
      - delay: ${paused_grace_time}
      - lambda: "id(g_media_playing) = false;"
      - script.execute: script_apply_mode

  # Debounce the volume slider so a drag sends one service call.
  - id: script_send_volume
    mode: restart
    then:
      - delay: 400ms
      - homeassistant.action:
          action: media_player.volume_set
          data:
            entity_id: ${ent_media_player}
          data_template:
            volume_level: "{{ vol }}"
          variables:
            vol: "return id(g_volume_pending);"

  # --- sounds ---------------------------------------------------------------
  - id: script_click
    mode: restart
    then:
      - if:
          condition:
            switch.is_off: sw_mute
          then:
            - rtttl.play: "click:d=32,o=7,b=280:c"

  - id: script_chime
    mode: restart
    then:
      - if:
          condition:
            switch.is_off: sw_mute
          then:
            - rtttl.play: "tick:d=16,o=6,b=160:e,g"

  - id: script_brush_done
    mode: restart
    then:
      - if:
          condition:
            switch.is_off: sw_mute
          then:
            - rtttl.play: "done:d=8,o=6,b=140:c,e,g,2c7"

  # --- tooth-brushing timer -------------------------------------------------
  - id: script_brush_toggle
    mode: single
    then:
      - if:
          condition:
            lambda: "return id(g_brush_active);"
          then:
            - script.stop: script_brush_run
            - lambda: "id(g_brush_active) = false;"
            - lvgl.widget.hide: overlay_brush
          else:
            - script.execute: script_brush_run

  - id: script_brush_run
    mode: restart
    then:
      - lambda: |-
          id(g_brush_active) = true;
          id(g_brush_remaining) = ${brush_seconds};
      - lvgl.label.update:
          id: lbl_brush_sub
          text: "Keep brushing!"
      - lvgl.widget.show: overlay_brush
      - while:
          condition:
            lambda: "return id(g_brush_remaining) > 0;"
          then:
            - lvgl.label.update:
                id: lbl_brush_time
                text: !lambda |-
                  char b[8];
                  int r = id(g_brush_remaining);
                  snprintf(b, sizeof(b), "%d:%02d", r / 60, r % 60);
                  return std::string(b);
            - lvgl.arc.update:
                id: arc_brush
                value: !lambda |-
                  const float total = ${brush_seconds};
                  return 100.0f * (total - id(g_brush_remaining)) / total;
            - delay: 1s
            - lambda: "id(g_brush_remaining) -= 1;"
            - if:
                condition:
                  lambda: |-
                    return id(g_brush_remaining) > 0 &&
                           (id(g_brush_remaining) % 30) == 0;
                then:
                  - script.execute: script_chime
      - lvgl.label.update:
          id: lbl_brush_time
          text: "0:00"
      - lvgl.arc.update:
          id: arc_brush
          value: 100
      - lvgl.label.update:
          id: lbl_brush_sub
          text: "All done!"
      - script.execute: script_brush_done
      - delay: 3s
      - lambda: "id(g_brush_active) = false;"
      - lvgl.widget.hide: overlay_brush

